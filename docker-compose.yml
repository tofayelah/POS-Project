services:
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: retailcore_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      db:
        condition: service_healthy
    networks:
      - retailcore_network

  webserver:
    image: nginx:alpine
    container_name: retailcore_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
    networks:
      - retailcore_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: retailcore_frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://webserver:80
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - retailcore_network
    command: npm run dev -- --host 0.0.0.0 --port 3000

  db:
    image: postgres:16-alpine
    container_name: retailcore_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-retailcore}
      POSTGRES_USER: ${DB_USERNAME:-retailcore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - retailcore_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-retailcore} -d ${DB_DATABASE:-retailcore}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  retailcore_network:
    driver: bridge

volumes:
  db_data:
